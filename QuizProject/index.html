<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizMaster - Online Quiz</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <div class="quiz-card">

            <div class="logo">
                QuizMaster
            </div>
            <a href="login.html" class="login-btn">
                Login
            </a>

            <a href="register.html" class="register-btn">
                Register
            </a>

            <h1>Test Your Knowledge</h1>

            <p class="description">
                Challenge yourself with interesting questions
                and see how much you know!
            </p>

            <h2>Select Quiz Category</h2>

            <div class="categories">

                <button class="category" data-category="Java">
                    Java
                </button>

                <button class="category" data-category="HTML">
                    HTML
                </button>

                <button class="category" data-category="CSS">
                    CSS
                </button>

                <button class="category" data-category="JavaScript">
                    JavaScript
                </button>

                <button class="category" data-category="SQL">
                    SQL
                </button>

            </div>

            <p id="message"></p>

            <button class="start-btn" id="startQuiz">
                Start Quiz
            </button>
            <button id="leaderboardBtn">🏆 Leaderboard</button>
            <button id="historyBtn">📊 Quiz History</button>
            <button id="dashboardBtn">👤 Dashboard</button>

        </div>

    </div>

    <script src="js/index.js"></script>

</body>

</html>
