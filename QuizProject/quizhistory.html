<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizMaster - Quiz History</title>
    <link rel="stylesheet" href="css/quizhistory.css">
</head>
<body>

    <div class="history-container">

        <div class="history-header">
            <h1>📊 Quiz History</h1>
            <p>View your previous quiz attempts</p>
        </div>

        <div class="history-card">

            <div class="table-header">
                <span>Category</span>
                <span>Score</span>
                <span>Result</span>
            </div>

            <div id="historyBody">
                <p class="loading">Loading quiz history...</p>
            </div>

        </div>

        <button id="goHome">Go to Home</button>

    </div>

    <script src="js/quizhistory.js"></script>

</body>
</html>
